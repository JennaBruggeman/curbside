<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhino / Grasshopper Live Control</title>
<style>
  :root {
    --bg: #1c1c1e;
    --panel: #242426;
    --panel-2: #2c2c2f;
    --border: #3a3a3d;
    --text: #e8e6e1;
    --text-dim: #9a9a9d;
    --accent: #c03030;
    --accent-dim: #7a2323;
    --mono: 'Consolas', 'SF Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }
  #layout {
    display: flex; height: 100vh;
  }
  #sidebar {
    width: 340px; min-width: 340px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  #sidebar-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 15px; font-weight: 600; margin: 0 0 2px;
    letter-spacing: 0.02em;
  }
  #sidebar-header .sub {
    font-size: 11px; color: var(--text-dim);
  }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #555; margin-right: 6px; vertical-align: middle;
  }
  .status-dot.live { background: #4caf6d; }
  .status-dot.down { background: var(--accent); }

  section.group {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  section.group h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin: 0 0 12px; font-weight: 600;
  }
  .param-row {
    margin-bottom: 14px;
  }
  .param-row:last-child { margin-bottom: 0; }
  .param-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--text-dim); margin-bottom: 6px;
  }
  .param-label span.val {
    font-family: var(--mono); color: var(--text); font-size: 12px;
  }
  input[type="range"] {
    width: 100%; accent-color: var(--accent);
    height: 4px; background: var(--panel-2);
  }
  input[type="number"] {
    width: 64px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 3px 6px;
    font-family: var(--mono); font-size: 12px;
  }
  select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 6px 8px; font-size: 12px;
  }
  .field-inline { display: flex; align-items: center; gap: 8px; }

  #context-box {
    font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
    line-height: 1.6; white-space: pre-wrap;
  }
  #context-box b { color: var(--text); }

  #main {
    flex: 1; display: flex; flex-direction: column;
    background: #141416;
  }
  #viewport-toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #viewport-toolbar select {
    width: auto; padding: 5px 8px;
  }
  #viewport-toolbar .spacer { flex: 1; }
  #fps-badge {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  }
  #viewport-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: hidden;
  }
  #viewport-img {
    max-width: 100%; max-height: 100%;
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    background: #000;
  }
  button {
    background: var(--accent); color: #fff; border: none;
    border-radius: 4px; padding: 6px 12px; font-size: 12px;
    cursor: pointer; font-weight: 600;
  }
  button:hover { background: #a82828; }
  button.secondary {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
  }
  button.secondary:hover { color: var(--text); }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>RHINO / GRASSHOPPER LIVE CONTROL</h1>
      <div class="sub"><span id="status-dot" class="status-dot"></span><span id="status-text">connecting…</span></div>
    </div>

    <section class="group">
      <h2>Box Parameters</h2>
      <div class="param-row">
        <div class="param-label"><span>Width (X)</span><span class="val" id="val-width">10</span></div>
        <input type="range" id="slider-width" min="0.5" max="100" step="0.5" value="10">
      </div>
      <div class="param-row">
        <div class="param-label"><span>Length (Y)</span><span class="val" id="val-length">10</span></div>
        <input type="range" id="slider-length" min="0.5" max="100" step="0.5" value="10">
      </div>
      <div class="param-row">
        <div class="param-label"><span>Height (Z)</span><span class="val" id="val-height">10</span></div>
        <input type="range" id="slider-height" min="0.5" max="100" step="0.5" value="10">
      </div>
    </section>

    <section class="group">
      <h2>Base Point</h2>
      <div class="param-row field-inline">
        <label style="width:16px;color:var(--text-dim);font-size:12px;">X</label>
        <input type="number" id="num-x" value="0" step="1">
        <label style="width:16px;color:var(--text-dim);font-size:12px;">Y</label>
        <input type="number" id="num-y" value="0" step="1">
        <label style="width:16px;color:var(--text-dim);font-size:12px;">Z</label>
        <input type="number" id="num-z" value="0" step="1">
      </div>
    </section>

    <section class="group">
      <h2>Document Context</h2>
      <div id="context-box">loading…</div>
    </section>

    <section class="group">
      <button class="secondary" id="btn-refresh-context" style="width:100%;">Refresh context</button>
    </section>
  </div>

  <div id="main">
    <div id="viewport-toolbar">
      <select id="select-view">
        <option value="perspective">Perspective</option>
        <option value="top">Top</option>
        <option value="front">Front</option>
        <option value="right">Right</option>
      </select>
      <select id="select-mode">
        <option value="Shaded">Shaded</option>
        <option value="Wireframe">Wireframe</option>
        <option value="Rendered">Rendered</option>
        <option value="Ghosted">Ghosted</option>
        <option value="X-Ray">X-Ray</option>
        <option value="Arctic">Arctic</option>
      </select>
      <div class="spacer"></div>
      <span id="fps-badge">— ms</span>
    </div>
    <div id="viewport-wrap">
      <img id="viewport-img" alt="Rhino viewport">
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
